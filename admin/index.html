<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TBARC Admin Login</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f6f2;font-family:"DM Sans",sans-serif;color:#203328;padding:20px}.box{width:min(100%,420px);background:#fff;border:1px solid #e1e9e1;border-radius:16px;padding:32px;box-shadow:0 14px 38px #043b2510}.brand{font:800 18px Manrope;color:#075333}.brand small{display:block;font:700 10px "DM Sans";letter-spacing:1.5px;color:#758278}.box h1{font:800 25px Manrope;margin:28px 0 5px;color:#043b25}.box p{font-size:13px;color:#66736a;margin:0 0 24px}label{display:block;font-size:12px;font-weight:800;margin:15px 0 7px}input{width:100%;padding:13px;border:1px solid #d6e0d8;border-radius:8px;font:14px "DM Sans"}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:8px;background:#075333;color:#fff;font-weight:800;cursor:pointer}button:disabled{opacity:.6}#msg{font-size:12px;min-height:20px;margin-top:14px;color:#b42318}.back{display:block;text-align:center;margin-top:18px;font-size:12px;color:#075333}
</style></head><body><main class="box"><a class="brand" href="../" style="text-decoration:none">TBARC INDIA<small>ADMINISTRATION</small></a><h1>Administrator login</h1><p>Sign in with your authorised TBARC administrator account.</p>
<form id="loginForm"><label for="email">Email address</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="loginBtn">Log in securely</button></form><div id="msg" role="status"></div><a class="back" href="../">← Back to public verification</a></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
import{firebaseConfig}from"../firebase-config.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),form=document.getElementById("loginForm"),msg=document.getElementById("msg"),btn=document.getElementById("loginBtn");
async function checkAdmin(user){const s=await getDoc(doc(db,"admins",user.uid));return s.exists()&&s.data().role==="admin";}
onAuthStateChanged(auth,async user=>{if(user){try{if(await checkAdmin(user))location.replace("dashboard.html");else{await auth.signOut();msg.textContent="This account is not authorised as a TBARC administrator.";}}catch(e){msg.textContent="Unable to validate administrator access. Check Firestore rules.";}}});
form.addEventListener("submit",async e=>{e.preventDefault();msg.textContent="";btn.disabled=true;btn.textContent="Signing in…";try{const c=await signInWithEmailAndPassword(auth,document.getElementById("email").value.trim(),document.getElementById("password").value);if(await checkAdmin(c.user))location.href="dashboard.html";else{await auth.signOut();msg.textContent="Access denied: this account is not an authorised administrator.";}}catch(e){msg.textContent=e.code==="auth/invalid-credential"?"Incorrect email or password.":e.message;}finally{btn.disabled=false;btn.textContent="Log in securely";}});
</script></body></html>
